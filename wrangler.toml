# cod-payment-center-worker — EcomModa
# ⚠️ name لازم يطابق اسم الـ Worker في داشبورد Cloudflare حرف بحرف.
#    لو اختلفوا، الـ build مش بيفشل — بينشر Worker جديد والأصلي بيتجمّد بصمت.

name               = "cod-payment-center-worker"
main               = "index.js"
compatibility_date = "2025-01-01"
workers_dev        = true

[observability]
enabled = true

# ─── D1 ──────────────────────────────────────────────
# الـ binding دايمًا "DB" — أي اسم تاني والكتابة بتفشل بصمت
[[d1_databases]]
binding       = "DB"
database_name = "ecommoda-dev-logs"
database_id   = "90db62d3-bd7e-4d92-912b-10fc78eeb565"

# ─── KV ──────────────────────────────────────────────
# نفس الـ namespace اللي بيكتب فيها cod-pre-register-payment-worker.
# غيابه = §PREREG بترمي (checkPendingPreReg/listPendingPreReg بيرموا من v3.2.0)
# فالفشل هيبان — بس التسجيل المسبق كله بيقف.
[[kv_namespaces]]
binding = "PRE_REG_KV"
id      = "aaeff3d84e2c4e87bc7cce6bfd83ce6b"

# ─── Vars (نص عادي — مش أسرار) ────────────────────────
# دي بتتطبّق فعليًا مع Workers Builds (اتأكدنا 22-08-2026).
[vars]
SHOP_DOMAIN = "6c7e1a-53.myshopify.com"

# ⚠️ الأسرار مبتتكتبش هنا أبدًا: WORKER_SECRET · CLIENT_ID · CLIENT_SECRET
#    Worker → Settings → Variables and Secrets → علّم Secret
#    وبعدها: Deployments → Version History → ⋯ → Promote version
#
# ⚠️ متغيرات/bindings ملغاة مش مكتوبة هنا عن قصد — أول deploy من git هيشيلها:
#    PREREG_WORKER_URL · PREREG_WORKER_SECRET · OSU_WORKER_URL ·
#    OSU_WORKER_SECRET · OSU_SERVICE (Service Binding)
#    (الأسرار منهم بتعيش بعد الـ deploy — تتشال يدويًا. ?action=diag بيقولك.)
